[package]
name = "stencilcraft-desktop"
version = "2.6.0"
description = "High-Performance SMT Stencil CAM & DFM Engine"
edition = "2021"

[lib]
name = "stencilcraft_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
stencil_core = { path = "core" }
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.17.2"

[workspace]
members = ["core"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true

